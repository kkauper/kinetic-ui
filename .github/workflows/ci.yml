# Quality gate only. Cloudflare builds and deploys the demo (see README, Deploy).
# `check` covers the TypeScript packages, `rust` the Rust core and the UniFFI layer,
# `kotlin-bindings` the generated Kotlin against the real library, `android-demo` the Android
# library and demo app, `apple` the iOS side.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: lts/*
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Test
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Rust
        # Installs the toolchain pinned in rust-toolchain.toml (rustup 1.28+, preinstalled).
        run: rustup toolchain install
      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Lint bindgen binary
        run: cargo clippy -p kinetic-ffi --features cli --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Generated bindings are up to date
        run: |
          scripts/generate-bindings.sh
          git diff --exit-code -- native/ packages/spec/generated/

  # Proves the generated Kotlin bindings end to end: JUnit runs against the host build of the Rust
  # library, with no Android SDK or emulator (the Android modules are skipped without an SDK).
  kotlin-bindings:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Rust
        # Installs the toolchain pinned in rust-toolchain.toml (rustup 1.28+, preinstalled).
        run: rustup toolchain install
      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: 21
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - name: Build the host library
        run: cargo build -p kinetic-ffi --release
      - name: Test Kotlin bindings
        working-directory: native/android
        run: ./gradlew :bindings-test:test

  # Builds the Android library and demo, lints the demo and runs the JVM tests (the library's unit
  # tests and the demo's Robolectric UI test). The hosted image ships the Android SDK, so
  # ANDROID_HOME is set and settings.gradle.kts includes :kinetic and :demo. The host build of the
  # Rust library is what Robolectric/JNA load (see uniffi.component.kinetic.libraryOverride in
  # demo/build.gradle.kts). No jniLibs are built here, so the debug APK compiles but would not run on
  # a device; the release workflow builds the real native libraries. Nothing runs on an emulator.
  android-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Rust
        # Installs the toolchain pinned in rust-toolchain.toml (rustup 1.28+, preinstalled).
        run: rustup toolchain install
      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Build the host library
        run: cargo build -p kinetic-ffi --release
      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: 21
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - name: Install the Android platform
        # compileSdk is 37 (package id android-37.0). Licences must be accepted first.
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          set +o pipefail
          yes | "$sdkmanager" --licenses > /dev/null
          set -o pipefail
          "$sdkmanager" --install "platforms;android-37.0" "build-tools;37.0.0"
      - name: Build, lint and test
        working-directory: native/android
        run: ./gradlew :kinetic:testDebugUnitTest :demo:assembleDebug :demo:lintDebug :demo:testDebugUnitTest
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-demo-reports
          path: |
            native/android/demo/build/reports/
            native/android/kinetic/build/reports/
          if-no-files-found: ignore

  # First real compile of the Core Motion / SwiftUI code: builds the XCFramework, runs the Swift
  # tests on macOS and builds the demo app for the iOS Simulator (no signing).
  apple:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Rust
        run: |
          rustup toolchain install
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios aarch64-apple-darwin x86_64-apple-darwin
      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Show toolchain versions
        run: |
          xcodebuild -version
          swift --version
          cargo --version
      - name: Build the XCFramework
        run: scripts/build-xcframework.sh
      - name: Test Swift package
        working-directory: native/apple
        run: swift test
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the demo project
        working-directory: native/apple/Demo
        run: xcodegen
      - name: Build the demo app
        working-directory: native/apple/Demo
        run: >
          xcodebuild -project KineticDemo.xcodeproj -scheme KineticDemo
          -destination 'generic/platform=iOS Simulator' -configuration Debug
          build CODE_SIGNING_ALLOWED=NO
