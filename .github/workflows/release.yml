# Builds the release assets and, for a version tag, publishes them as a GitHub release.
#
#   git tag v0.1.0 && git push origin v0.1.0     publishes a release
#   Releases > Draft a new release > Publish     same, from github.com (the run fills it in)
#   Actions > Release > Run workflow             dry run: builds everything, publishes nothing
#
# The version has one source: "version" in the root package.json. The `verify` job fails the
# run early if the tag or any other version in the repo disagrees with it.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Versions agree
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "package.json: $version"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            if [ "$GITHUB_REF_NAME" != "v$version" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match package.json version v$version"
              exit 1
            fi
          else
            echo "Not a tag run (dry run): skipping the tag check."
          fi
          fail=0
          check() {
            if [ "$2" != "$version" ]; then
              echo "::error::$1 is '$2', expected '$version'"
              fail=1
            fi
          }
          for pkg in packages/core packages/react packages/spec apps/demo; do
            check "$pkg/package.json" "$(node -p "require('./$pkg/package.json').version")"
          done
          check "Cargo.toml workspace version" "$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          check "Android demo versionName" "$(sed -n 's/.*versionName = "\(.*\)"/\1/p' native/android/demo/build.gradle.kts)"
          check "iOS demo MARKETING_VERSION" "$(sed -n 's/.*MARKETING_VERSION: "\(.*\)"/\1/p' native/apple/Demo/project.yml)"
          [ "$fail" = 0 ]
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            scripts/release-notes.sh "$version" > /dev/null
          fi

  apple:
    needs: verify
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Rust
        run: |
          rustup toolchain install
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios aarch64-apple-darwin x86_64-apple-darwin
      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Build the XCFramework
        run: scripts/build-xcframework.sh
      - name: Zip the XCFramework
        run: >
          ditto -c -k --sequesterRsrc --keepParent
          native/apple/KineticFFI.xcframework KineticFFI.xcframework.zip
      - name: Compute the SwiftPM checksum
        # Run inside the package so SwiftPM has a manifest to work from.
        working-directory: native/apple
        run: swift package compute-checksum "$GITHUB_WORKSPACE/KineticFFI.xcframework.zip" | tr -d '[:space:]' > "$GITHUB_WORKSPACE/KineticFFI.xcframework.zip.checksum"
      - name: Show the checksum
        run: cat KineticFFI.xcframework.zip.checksum; echo
      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: apple
          path: |
            KineticFFI.xcframework.zip
            KineticFFI.xcframework.zip.checksum
          if-no-files-found: error

  android:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Rust
        run: |
          rustup toolchain install
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked --version 4.1.2
      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: 21
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - name: Locate the Android SDK and NDK
        # The hosted Ubuntu image ships the SDK (ANDROID_HOME) and a default NDK
        # (ANDROID_NDK_HOME, also ANDROID_NDK_LATEST_HOME). scripts/build-android.sh reads
        # ANDROID_NDK_HOME. If the image has no NDK, install one with sdkmanager.
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK_HOME=${ANDROID_NDK_HOME:-}"
          echo "ANDROID_NDK_LATEST_HOME=${ANDROID_NDK_LATEST_HOME:-}"
          ndk="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          if [ -z "$ndk" ] || [ ! -d "$ndk" ]; then
            sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            "$sdkmanager" --install "ndk;28.2.13676358"
            ndk="$ANDROID_HOME/ndk/28.2.13676358"
          fi
          echo "Using NDK at $ndk"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
      - name: Install the Android platform
        # compileSdk is 37 (package id android-37.0). Gradle would download it on demand, but only after licences are accepted.
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          set +o pipefail
          yes | "$sdkmanager" --licenses > /dev/null
          set -o pipefail
          "$sdkmanager" --install "platforms;android-37.0" "build-tools;37.0.0"
      - name: Build the native libraries
        run: scripts/build-android.sh
      - name: Build the AAR
        working-directory: native/android
        run: ./gradlew :kinetic:assembleRelease
      - name: Name the AAR
        run: |
          version="$(node -p "require('./package.json').version")"
          mkdir -p out
          cp native/android/kinetic/build/outputs/aar/kinetic-release.aar "out/kinetic-android-$version.aar"
          ls -l out
          unzip -l "out/kinetic-android-$version.aar" | grep libkinetic_ffi.so
      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android
          path: out/kinetic-android-*.aar
          if-no-files-found: error

  web:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: lts/*
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Zip the demo
        run: (cd apps/demo/dist && zip -r -q "$GITHUB_WORKSPACE/kinetic-ui-demo-web.zip" .)
      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: web
          path: kinetic-ui-demo-web.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify, apple, android, web]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Publishing waits for the protection rules (required reviewer) of the `release`
    # environment, set in the repository settings.
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: assets
          merge-multiple: true
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            assets/KineticFFI.xcframework.zip
            assets/KineticFFI.xcframework.zip.checksum
            assets/kinetic-android-*.aar
            assets/kinetic-ui-demo-web.zip
      - name: Write the release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          checksum="$(tr -d '[:space:]' < assets/KineticFFI.xcframework.zip.checksum)"
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/KineticFFI.xcframework.zip"
          scripts/release-notes.sh "$version" > notes.md
          {
            echo
            echo "### Swift Package Manager"
            echo
            echo "Add the Rust core to your own package as a remote binary target:"
            echo
            echo '```swift'
            echo '.binaryTarget('
            echo '    name: "KineticFFI",'
            echo "    url: \"$url\","
            echo "    checksum: \"$checksum\""
            echo ')'
            echo '```'
          } >> notes.md
          cat notes.md
      # A release created by hand on github.com (which also creates the tag) is filled in
      # rather than failing: title and notes are replaced and the assets uploaded.
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=(
            assets/KineticFFI.xcframework.zip
            assets/KineticFFI.xcframework.zip.checksum
            assets/kinetic-android-*.aar
            assets/kinetic-ui-demo-web.zip
          )
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "Kinetic UI $GITHUB_REF_NAME" --notes-file notes.md
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" --title "Kinetic UI $GITHUB_REF_NAME" --notes-file notes.md "${files[@]}"
          fi
