[package]
name = "kinetic-ffi"
description = "UniFFI layer over kinetic-core: generates the Swift and Kotlin bindings."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "kinetic_ffi"
crate-type = ["cdylib", "staticlib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["cli"]

[features]
cli = ["uniffi/cli"]

[dependencies]
kinetic-core = { path = "../kinetic-core" }
uniffi = { version = "=0.32.2" }

[lints]
workspace = true
