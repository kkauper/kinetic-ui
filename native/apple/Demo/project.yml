# Generate the Xcode project with: brew install xcodegen && xcodegen
# (the .xcodeproj is git-ignored; this file is the reviewable source of truth).
# Prerequisite: ../../../scripts/build-xcframework.sh has produced ../KineticFFI.xcframework.
name: KineticDemo
options:
  bundleIdPrefix: co.kauper.kineticui
  deploymentTarget:
    iOS: "17.0"
packages:
  KineticUI:
    path: ..
settings:
  base:
    SWIFT_VERSION: "6.0"
    # Fill in your team to run on a device (or set it in Xcode's Signing & Capabilities).
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  KineticDemo:
    type: application
    platform: iOS
    sources:
      - KineticDemo
    dependencies:
      - package: KineticUI
        product: KineticUI
    info:
      path: KineticDemo/Info.plist
      properties:
        CFBundleDisplayName: Kinetic UI
        NSMotionUsageDescription: Kinetic UI uses motion data to notice when you are walking and simplify the form.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.kauper.kineticui.demo
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
